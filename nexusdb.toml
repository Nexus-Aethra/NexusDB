# NexusDB 服务配置 (所有字段可省略, 缺省用默认值)

[server]
listen_addr = "0.0.0.0:5433"
worker_count = 2
redis_addr = "0.0.0.0:6379"     # RESP (Redis 兼容) 监听地址, 空 = 禁用
sql_addr = "0.0.0.0:5434"       # SQL 门面 (MySQL wire) 监听地址, 空 = 禁用
sql_worker_count = 1            # ⭐ 共享 worker 池下作参考 (实际线程数 = worker_count); 预留, 便于未来 per-protocol 池
pg_addr = "0.0.0.0:5435"        # SQL 门面 (PostgreSQL wire) 监听地址, 空 = 禁用
http_addr = "0.0.0.0:6778"      # REST 门面 (HTTP/1.1 JSON) 监听地址, 空 = 禁用
http_cors_origin = ""           # CORS Allow-Origin ("*" 或具体 origin, 空 = 不发 CORS 头)
http_token = ""                 # REST Bearer token (空 = 免鉴权; /metrics /v1/status 恒免)
sql_password = ""               # SQL 登录密码 (两门面共用), 空 = 免密
redis_password = ""             # RESP AUTH 密码, 空 = 不启用认证
max_key_bytes = 1024            # key 长度上限 (协议层拦截)
max_value_bytes = 1048576       # value 长度上限 (>~4000B 自动走溢出页, 上限 1MB)

[storage]
block_root = "./data"
num_shards = 6
io_backend = "io_uring"        # "stdfs" | "io_uring"
chunk_cache_size = 16
wal_mode = "periodic"          # WAL 档位: off (无) | periodic (每秒 fsync, 窗口 ~1s) | strict (回复前 fsync, 零丢失)
create_if_missing = true
default_db = "default"
default_table = "default"
precreate_dbs = 0              # 预建 db1..dbN 供 RESP `SELECT n` 选库 (0 = 只有默认库)

[log]
level = "info"                 # error|warn|info|debug|trace
dir = "./logs"                 # 空 = 仅 stderr
buffer_kb = 64                 # 累积量阈值 (KB)
flush_interval_ms = 500        # 时间阈值 (ms)
stderr = true                  # Error/Warn 直通 stderr
