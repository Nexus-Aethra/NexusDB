[package]
name = "network"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
scheduler = { path = "../scheduler" }
shard_manager = { path = "../shard_manager" }
storage = { path = "../storage" }
nlog = { path = "../logging" }
# ⭐ 嵌入的 sqlparser-rs (PG 方言前端; 渐进替换手写 parser)
sqlparser = { path = "../sqlparser" }
crossbeam-channel = "0.5"
libc = "0.2"
thiserror = "2"
serde_json = "1"
# ⭐ F83: TLS (SQL 门面传输加密). ring 后端 (纯 Rust + 少量汇编, 免 aws-lc 的 cmake C 构建).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
tempfile = "3"
storage = { path = "../storage" }