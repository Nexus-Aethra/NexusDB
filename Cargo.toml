[workspace]
resolver = "2"
members = [
    "crates/platform",
    "crates/scheduler",
    "crates/page",
    "crates/storage",
    "crates/shard_manager",
    "crates/network",
    "crates/config",
    "crates/logging",
    "crates/scanner",
]

[package]
name = "NexusDB"
version = "0.1.0"
edition = "2024"

[lib]
name = "nexusdb"
path = "src/lib.rs"

[dependencies]
config = { path = "crates/config" }
nlog = { path = "crates/logging" }
storage = { path = "crates/storage" }
shard_manager = { path = "crates/shard_manager" }
network = { path = "crates/network" }
libc = "0.2"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
