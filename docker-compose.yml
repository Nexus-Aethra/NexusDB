# NexusDB docker-compose — 一键起库 + 持久化卷
# 用法:  docker compose up -d   /   docker compose logs -f   /   docker compose down
services:
  nexusdb:
    build: .
    image: nexusdb:latest
    container_name: nexusdb
    restart: unless-stopped
    ports:
      - "6379:6379"   # RESP (Redis 兼容)
      - "5434:5434"   # MySQL wire
      - "5435:5435"   # PostgreSQL wire
      - "6778:6778"   # HTTP REST + /metrics
    volumes:
      - nexusdb-data:/data
      # 启用 TLS (可选): 挂证书目录, 并在配置里指向 /etc/nexusdb/certs/*.pem
      # - ./certs:/etc/nexusdb/certs:ro
    # ⭐ 让 NexusDB 在容器内使用 io_uring:
    #   compose 的 security_opt 内联 JSON 会因过长触发 "file name too long",
    #   因此用 docker run 脚本 (deploy/run.sh) 启动, 由 daemon 直接读取 profile 文件。
    #   docker run 支持 seccomp=<file> 由 daemon 读文件, 无长度限制。
    #   参考 deploy/run.sh 的完整启动命令。
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6778/v1/status || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  nexusdb-data:
